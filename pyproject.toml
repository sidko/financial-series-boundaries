[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "financial-series-boundaries"
version = "0.1.0"
description = "Fail-closed effective-date financial series and annual boundary calculations"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Sid Kalla" }]
classifiers = ["Development Status :: 4 - Beta", "License :: OSI Approved :: Apache Software License", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12", "Programming Language :: Python :: 3.13"]
dependencies = ["pandas>=2.2,<4"]

[project.optional-dependencies]
test = ["pytest>=7"]
dev = ["build>=1.0", "pytest>=7"]

[project.urls]
Homepage = "https://github.com/sidko/financial-series-boundaries"
Repository = "https://github.com/sidko/financial-series-boundaries"
Issues = "https://github.com/sidko/financial-series-boundaries/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.hatch.build.targets.wheel]
packages = ["src/financial_series_boundaries"]

[tool.hatch.build.targets.wheel.force-include]
"README.md" = "README.md"
"LICENSE" = "LICENSE"
"NOTICE" = "NOTICE"
